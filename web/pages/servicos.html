<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços | Elian Sigs</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="wrapper">
    <div id="sidebar"></div>
    <main class="main">
        <div id="topbar"></div>
        <section class="content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Serviços</h1>
                    <p class="page-subtitle">Cadastro de serviços, variações e preços.</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-light" onclick="abrirModalCategoria()"><i class="fas fa-tags"></i> Nova categoria</button>
                    <button class="btn btn-primary" onclick="abrirModalServico()"><i class="fas fa-plus"></i> Novo serviço</button>
                </div>
            </div>

            <div class="card"><div class="card-body">
                <div class="filters"><div class="form-group">
                    <label>Pesquisar</label>
                    <input id="pesquisa" class="form-control" placeholder="Código, serviço ou categoria..." onkeyup="filtrarServicos()">
                </div></div>
                <div class="table-responsive"><table class="table">
                    <thead><tr><th>Código</th><th>Serviço</th><th>Categoria</th><th>Unidade</th><th>Variações</th><th width="130">Ações</th></tr></thead>
                    <tbody id="tabelaServicos"></tbody>
                </table></div>
            </div></div>

            <div class="modal-overlay" id="modalServico">
                <div class="modal modal-xl">
                    <div class="modal-header"><h2 id="tituloModalServico">Novo serviço</h2><button class="modal-close" onclick="fecharModalServico()">&times;</button></div>
                    <form id="formServico">
                        <div class="modal-body">
                            <div class="row">
                                <div class="col"><div class="form-group"><label>Código *</label><input id="codigo" class="form-control" required></div></div>
                                <div class="col"><div class="form-group"><label>Nome *</label><input id="nome" class="form-control" required></div></div>
                            </div>
                            <div class="row">
                                <div class="col"><div class="form-group"><label>Categoria *</label><select id="categoriaId" class="form-control" required></select></div></div>
                                <div class="col"><div class="form-group"><label>Unidade *</label><select id="unidadeMedida" class="form-control"><option value="UN">Unidade</option><option value="H">Hora</option><option value="DIA">Diária</option><option value="M">Metro</option><option value="M2">Metro quadrado</option><option value="M3">Metro cúbico</option><option value="PC">Peça</option></select></div></div>
                            </div>
                            <div class="form-group"><label>Descrição</label><textarea id="descricao" class="form-control" rows="2"></textarea></div>
                            <div class="d-flex justify-between align-center mb-3 mt-3"><h3>Variações do serviço</h3><button type="button" class="btn btn-success" onclick="adicionarVariacao()"><i class="fas fa-plus"></i> Adicionar variação</button></div>
                            <div class="table-responsive"><table class="table">
                                <thead><tr><th>Código *</th><th>Descrição *</th><th>Custo</th><th>Preço de venda *</th><th width="60"></th></tr></thead>
                                <tbody id="tabelaVariacoes"></tbody>
                            </table></div>
                        </div>
                        <div class="modal-footer"><button type="button" class="btn btn-light" onclick="fecharModalServico()">Cancelar</button><button type="submit" class="btn btn-primary">Salvar serviço</button></div>
                    </form>
                </div>
            </div>

            <div class="modal-overlay" id="modalCategoriaServico">
                <div class="modal">
                    <div class="modal-header"><h2>Nova categoria de serviço</h2><button class="modal-close" onclick="fecharModalCategoria()">&times;</button></div>
                    <form id="formCategoriaServico">
                        <div class="modal-body"><div class="form-group"><label>Nome *</label><input id="nomeCategoria" class="form-control" required></div><div class="form-group"><label>Descrição</label><textarea id="descricaoCategoria" class="form-control"></textarea></div></div>
                        <div class="modal-footer"><button type="button" class="btn btn-light" onclick="fecharModalCategoria()">Cancelar</button><button class="btn btn-primary" type="submit">Salvar categoria</button></div>
                    </form>
                </div>
            </div>
        </section>
    </main>
</div>
<script src="../js/layout.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/app.js"></script><script src="../js/menu.js"></script><script src="../js/servicos.js"></script>
</body>
</html>
