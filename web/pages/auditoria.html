<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Auditoria | Elian Sigs</title>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body><div class="wrapper"><div id="sidebar"></div><main class="main"><div id="topbar"></div><section class="content">
<div class="page-header"><div><h1 class="page-title">Auditoria</h1><p class="page-subtitle">Rastreabilidade das alterações realizadas pelos usuários.</p></div></div>
<div class="card"><div class="card-body">
<div class="filters">
<div class="form-group"><label>Módulo</label><input id="filtroModulo" class="form-control" placeholder="Ex.: clientes, compras..." oninput="carregarAuditoria()"></div>
<div class="form-group"><label>Resultado</label><select id="filtroSucesso" class="form-control" onchange="carregarAuditoria()"><option value="">Todos</option><option value="true">Sucesso</option><option value="false">Falha</option></select></div>
</div>
<div class="table-responsive"><table class="table"><thead><tr><th>Data</th><th>Usuário</th><th>Módulo</th><th>Ação</th><th>Rota</th><th>Status</th></tr></thead><tbody id="tabelaAuditoria"></tbody></table></div>
</div></div>
</section></main></div>
<script src="../js/layout.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/app.js"></script><script src="../js/menu.js"></script><script src="../js/auditoria.js"></script>
</body></html>
