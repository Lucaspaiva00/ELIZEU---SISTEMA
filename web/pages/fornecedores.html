<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedores | Elian Sigs</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="wrapper">
    <div id="sidebar"></div>
    <main class="main">
        <div id="topbar"></div>
        <section class="content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Fornecedores</h1>
                    <p class="page-subtitle">Empresas e pessoas de quem são comprados materiais, produtos e insumos.</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary" onclick="abrirModalFornecedor()"><i class="fas fa-plus"></i> Novo Fornecedor</button>
                </div>
            </div>
            <div class="card"><div class="card-body">
                <div class="filters"><div class="form-group"><label>Pesquisar</label><input id="pesquisaFornecedor" class="form-control" placeholder="Nome, CPF/CNPJ, e-mail ou telefone..." oninput="renderizarFornecedores()"></div></div>
                <div class="table-responsive"><table class="table">
                    <thead><tr><th>Fornecedor</th><th>CPF/CNPJ</th><th>Contato</th><th>Pix</th><th>Status</th><th width="130">Ações</th></tr></thead>
                    <tbody id="tabelaFornecedores"></tbody>
                </table></div>
            </div></div>

            <div class="modal-overlay" id="modalFornecedor" data-modal-tabs>
                <div class="modal modal-lg modal-tabbed">
                    <div class="modal-header"><div><h2 class="modal-title" id="tituloModalFornecedor">Cadastro de Fornecedor</h2><p class="modal-section-help">Cadastro separado da base de clientes.</p></div><button type="button" class="modal-close" onclick="fecharModalFornecedor()">&times;</button></div>
                    <div class="modal-tabs" role="tablist">
                        <button type="button" class="modal-tab active" data-modal-tab="dados"><i class="fas fa-building"></i> Identificação</button>
                        <button type="button" class="modal-tab" data-modal-tab="contato"><i class="fas fa-phone"></i> Contato</button>
                        <button type="button" class="modal-tab" data-modal-tab="endereco"><i class="fas fa-location-dot"></i> Endereço</button>
                        <button type="button" class="modal-tab" data-modal-tab="pagamento"><i class="fas fa-building-columns"></i> Pagamento</button>
                    </div>
                    <div class="modal-body"><form id="formFornecedor">
                        <section class="modal-tab-panel active" data-modal-panel="dados"><div class="modal-section-card">
                            <div class="modal-fields-2">
                                <div class="form-group"><label>Tipo</label><select id="fornecedorTipoPessoa" class="form-control"><option value="JURIDICA">Pessoa Jurídica</option><option value="FISICA">Pessoa Física</option></select></div>
                                <div class="form-group"><label>CPF / CNPJ</label><input id="fornecedorCpfCnpj" class="form-control" required></div>
                                <div class="form-group"><label>Nome / Razão Social</label><input id="fornecedorNome" class="form-control" required></div>
                                <div class="form-group"><label>Nome Fantasia</label><input id="fornecedorNomeFantasia" class="form-control"></div>
                                <div class="form-group"><label>Inscrição Estadual</label><input id="fornecedorInscricaoEstadual" class="form-control"></div>
                            </div>
                        </div></section>
                        <section class="modal-tab-panel" data-modal-panel="contato"><div class="modal-section-card"><div class="modal-fields-3">
                            <div class="form-group"><label>E-mail</label><input id="fornecedorEmail" type="email" class="form-control"></div>
                            <div class="form-group"><label>Telefone</label><input id="fornecedorTelefone" class="form-control"></div>
                            <div class="form-group"><label>Celular</label><input id="fornecedorCelular" class="form-control"></div>
                        </div></div></section>
                        <section class="modal-tab-panel" data-modal-panel="endereco"><div class="modal-section-card">
                            <div class="modal-fields-3">
                                <div class="form-group"><label>CEP</label><input id="fornecedorCep" class="form-control"></div>
                                <div class="form-group"><label>Endereço</label><input id="fornecedorEndereco" class="form-control"></div>
                                <div class="form-group"><label>Número</label><input id="fornecedorNumero" class="form-control"></div>
                                <div class="form-group"><label>Complemento</label><input id="fornecedorComplemento" class="form-control"></div>
                                <div class="form-group"><label>Bairro</label><input id="fornecedorBairro" class="form-control"></div>
                                <div class="form-group"><label>Cidade</label><input id="fornecedorCidade" class="form-control"></div>
                                <div class="form-group"><label>Estado</label><input id="fornecedorEstado" maxlength="2" class="form-control"></div>
                            </div>
                        </div></section>
                        <section class="modal-tab-panel" data-modal-panel="pagamento"><div class="modal-section-card">
                            <div class="modal-section-head"><div><h3>Dados para pagamento</h3><p>Esses dados aparecem no contas a pagar e nas compras de estoque.</p></div></div>
                            <div class="modal-fields-2">
                                <div class="form-group"><label>Tipo da chave Pix</label><select id="fornecedorPixTipo" class="form-control"><option value="">Não informado</option><option value="CNPJ">CNPJ</option><option value="CPF">CPF</option><option value="EMAIL">E-mail</option><option value="TELEFONE">Telefone</option><option value="ALEATORIA">Aleatória</option></select></div>
                                <div class="form-group"><label>Chave Pix</label><input id="fornecedorPixChave" class="form-control"></div>
                                <div class="form-group"><label>Banco</label><input id="fornecedorBancoNome" class="form-control"></div>
                                <div class="form-group"><label>Agência</label><input id="fornecedorBancoAgencia" class="form-control"></div>
                                <div class="form-group"><label>Conta</label><input id="fornecedorBancoConta" class="form-control"></div>
                            </div>
                            <div class="form-group"><label>Observações</label><textarea id="fornecedorObservacoes" class="form-control"></textarea></div>
                        </div></section>
                    </form></div>
                    <div class="modal-footer"><button class="btn btn-light" onclick="fecharModalFornecedor()">Cancelar</button><button class="btn btn-primary" onclick="salvarFornecedor()"><i class="fas fa-save"></i> Salvar Fornecedor</button></div>
                </div>
            </div>
        </section>
    </main>
</div>
<script src="../js/layout.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script><script src="../js/app.js"></script><script src="../js/menu.js"></script><script src="../js/fornecedores.js"></script>
</body>
</html>
